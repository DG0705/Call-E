# Development-only Asterisk for exercising the voice service adapter.
# Usage: docker compose -f docker-compose.yml -f docker-compose.asterisk.yml up -d asterisk

services:
  asterisk:
    build:
      context: services/voice-service
      dockerfile: telephony/asterisk/Dockerfile
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "10000-10099:10000-10099/udp"
    healthcheck:
      test:
        - CMD-SHELL
        - asterisk -rx "core show version" | grep -i asterisk
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - call-e-network
