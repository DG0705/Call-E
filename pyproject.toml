[project]
name = "call-e"
version = "0.1.0"
description = "Call-E microservice monorepo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = ["shared", "services/*"]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "services"]
pythonpath = ["shared/src"]
addopts = ["--import-mode=importlib"]
