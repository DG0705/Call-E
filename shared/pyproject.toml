[project]
name = "call-e-shared"
version = "0.1.0"
description = "Shared platform primitives for Call-E services"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_e_shared"]
