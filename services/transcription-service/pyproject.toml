[project]
name = "call-e-transcription-service"
version = "0.1.0"
description = "Call-E transcription-service service"
requires-python = ">=3.13"
dependencies = [
    "call-e-shared",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
call-e-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription_service"]
