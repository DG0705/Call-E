; Development-only dialplan for the Call-E voice service adapter.
; The caller dials an extension that lands in call-e-inbound, which hands the
; channel to the Call-E ARI application ("call-e") that the voice service
; registers against. The voice service then answers, plays the agent greeting,
; and streams the Kaari agent's responses.
;
; No numbers, DIDs, or credentials are committed here; choose a local extension
; and override it with a mounted config when running a real demo.

[from-internal]
; Outbound channels originated by Call-E reach this context.
exten => _X.,1,NoOp(Call-E outbound channel started)

[call-e-inbound]
; Development entry point for inbound calls to the Kaari agent.
; Any extension arriving here is handed to the Call-E ARI application.
exten => _X.,1,NoOp(Call-E inbound channel accepted for extension ${EXTEN})
same => n,Stasis(call-e)
