; Development-only PJSIP for the Call-E voice service adapter.
; Replace transport/endpoint values with your PBX provisioning before use.
; The SIP registration password below is a placeholder: set your own secret and
; do NOT commit credentials to the repository.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Dockerized Asterisk advertises its container IP (e.g. 172.19.0.x) in SDP by
; default, which the host softphone cannot route RTP to. Always advertise
; localhost instead so phone RTP reaches the published host UDP ports
; (10000-10099) that Docker forwards to this container. Do NOT add a
; local_net here: Docker source-NATs host-originated SIP to the bridge
; gateway (172.19.0.1), which falls inside any Docker-sized local_net and
; would make Asterisk classify the phone as local and advertise the
; unroutable container IP again. If the softphone moves off-host, set this
; to the host LAN IP reachable from the phone instead of 127.0.0.1.
external_media_address = 127.0.0.1

; The developer's softphone registers as this endpoint and places calls that
; land in the call-e-inbound dialplan so they reach the Call-E voice service.
[dev-phone]
type = endpoint
identify_by = username
context = call-e-inbound
disallow = all
allow = ulaw
# allow_transport = udp
auth = auth-call-e-dev-phone
aors = dev-phone

[auth-call-e-dev-phone]
type = auth
auth_type = userpass
username = dev-phone
password =callesoftphone2026

[dev-phone]
type = aor
max_contacts = 1

; Endpoint used when Call-E originates an outbound channel.
[endpoint-call-e-outbound]
type = endpoint
context = from-internal
disallow = all
allow = ulaw
# allow_transport = udp

[channel-call-e-outbound]
type = aor
max_contacts = 1
