; Development-only PJSIP placeholder for the Call-E voice service adapter.
; Replace transport/endpoint values with your PBX provisioning before use.
; No credentials are committed to the repository.

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[endpoint-call-e-outbound]
type = endpoint
context = from-internal
disallow = all
allow = ulaw
allow_transport = udp

[channel-call-e-outbound]
type = aor
max_contacts = 1
