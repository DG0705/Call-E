; Development-only ARI configuration for the Call-E voice service adapter.
; The voice service's HTTP transport authenticates with these credentials via
; HTTP Basic over the ARI REST API. Use a local-only password and do not commit
; real credentials to the repository.

[general]
enabled = yes
pretty = yes
allowed_origins = *

[call-e-user]
type = user
password = CHANGE_ME_ARI_LOCAL_ONLY
read_only = no
