[project]
name = "call-e-agent-service"
version = "0.1.0"
description = "Call-E agent-service service"
requires-python = ">=3.13"
dependencies = [
    "call-e-shared",
    "fastapi>=0.115.0",
    "groq>=0.31.0",
    "jsonschema>=4.0.0",
    "pymongo>=4.11,<5",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
call-e-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service"]
