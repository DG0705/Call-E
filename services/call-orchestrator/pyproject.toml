[project]
name = "call-e-call-orchestrator"
version = "0.1.0"
description = "Call-E call-orchestrator service"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_orchestrator"]

